name: idle_detector
description: >-
  A Flutter widget that detects when the user stops interacting with your app
  (touch, mouse, scroll, trackpad or keyboard) and when they come back.
version: 1.0.0
repository: https://github.com/sharpsan/idle_detector
issue_tracker: https://github.com/sharpsan/idle_detector/issues
topics:
  - idle
  - inactivity
  - timeout
  - session
  - user-activity

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  clock: ^1.1.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
